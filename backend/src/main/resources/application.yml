spring:
  application:
    name: video-platform-backend
  datasource:
    url: jdbc:h2:file:./data/video-platform
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

verification:
  code-expiration-seconds: 180
  send-window-seconds: 3600
  max-send-count: 5
  max-verify-attempts: 5

sms:
  provider: logging
