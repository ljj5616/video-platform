spring:
  application:
    name: video-platform-backend
  datasource:
    url: jdbc:h2:file:./data/video-platform
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1035MB

video:
  upload:
    max-video-size: 1GB
    max-thumbnail-size: 10MB
    default-thumbnail-url: ${DEFAULT_VIDEO_THUMBNAIL_URL:}
  storage:
    bucket: ${VIDEO_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${VIDEO_S3_ENDPOINT:}
    public-base-url: ${VIDEO_PUBLIC_BASE_URL:}
  ffmpeg:
    executable: ${FFMPEG_PATH:ffmpeg}
    ffprobe-executable: ${FFPROBE_PATH:ffprobe}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

verification:
  code-expiration-seconds: 180
  send-window-seconds: 3600
  max-send-count: 5
  max-verify-attempts: 5

password-reset:
  token-expiration-seconds: 600
  mail-from: ${SMTP_FROM:${SMTP_USERNAME:}}

sms:
  provider: logging
