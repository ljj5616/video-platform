services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: video_platform
      POSTGRES_USER: video_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
